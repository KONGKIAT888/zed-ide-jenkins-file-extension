name = "Jenkinsfile"
grammar = "groovy"
path_suffixes = ["Jenkinsfile", "jenkinsfile", ".jenkinsfile", "groovy"]
first_line_pattern = '(^\s*pipeline\s*\{)|(^\s*node\s*\{)|(^#!.*groovy)'
line_comments = ["// "]
tab_size = 4

autoclose_before = "}])\"'"

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
