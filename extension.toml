id = "jenkinsfile"
name = "Jenkinsfile"
description = "Jenkinsfile (Groovy Pipeline) support: syntax highlighting, bracket matching, auto-indent, comment toggling, `sh` step bash injection, stage outline, and optional Groovy language server integration."
version = "0.1.0"
schema_version = 1
authors = ["u0038"]
repository = "https://github.com/u0038/zed-ide-jenkins-file-extension"

[language_servers.groovy-language-server]
name = "Groovy Language Server"
languages = ["Jenkinsfile"]
opt_in_languages = ["Jenkinsfile"]

[language_servers.groovy-language-server.language_ids]
"Jenkinsfile" = "groovy"

[grammars.groovy]
repository = "https://github.com/murtaza64/tree-sitter-groovy"
commit = "2a6ddd558b6aa39c5b77d8db9fe9baf817486b2c"
